[project]
name = "aq-sdk"
version = "0.1.0"
description = "Send traces to AQ and run evaluations from code and from CI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[project.optional-dependencies]
evidence = ["cryptography>=42"]
test = ["pytest>=8", "cryptography>=42"]

[project.scripts]
aq = "aq_sdk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aq_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
